name: 'Continuous Integration'

on:
    pull_request:
    push:
        branches:
            - '*.x'
            - 'main'
        tags:
            - 'v*.*.*'

permissions:
    contents: read

# Supersede outdated runs of a pull request; push runs (head_ref empty) are never cancelled.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    matrix:
        name: Generate job matrix
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - name: Gather CI configuration
              id: matrix
              uses: laminas/laminas-ci-matrix-action@v1

    qa:
        name: QA Checks
        needs: [matrix]
        runs-on: ${{ matrix.operatingSystem }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
        steps:
            - name: ${{ matrix.name }}
              uses: laminas/laminas-continuous-integration-action@v1
              with:
                  job: ${{ matrix.job }}
            - name: Upload coverage
              if: ${{ !cancelled() && startsWith(matrix.name, 'PHPUnit [') && endsWith(matrix.name, ', latest]') }}
              uses: actions/upload-artifact@v7
              with:
                  name: clover-${{ fromJSON(matrix.job).php }}
                  path: coverage/clover.xml
                  if-no-files-found: ignore
                  retention-days: 30

    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: assets
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  package_json_file: 'assets/package.json'
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'
                  cache-dependency-path: 'assets/pnpm-lock.yaml'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Biome
              run: pnpm lint
            - name: Typecheck
              run: pnpm typecheck

    test:
        name: Test (${{ matrix.dependencies }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    # the locked versions: React 19, Vue 3.5, Preact 11
                    - dependencies: latest
                    # the lowest versions of the peer dependency ranges
                    - dependencies: lowest
                      packages: react@18.0.0 react-dom@18.0.0 vue@3.0.0 preact@10.0.0
                    - dependencies: Preact 10
                      packages: preact@^10
        defaults:
            run:
                working-directory: assets
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  package_json_file: 'assets/package.json'
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'
                  cache-dependency-path: 'assets/pnpm-lock.yaml'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            # Only the tests run on these versions: the typecheck uses the locked types.
            # preact 10.0.0 has a postinstall script (a donation message), pnpm must skip it instead of failing.
            - name: Install the ${{ matrix.dependencies }} versions
              if: ${{ matrix.packages }}
              run: pnpm add --save-dev --config.strict-dep-builds=false ${{ matrix.packages }}
            - name: Test
              run: pnpm test:coverage
            - name: Upload coverage
              if: ${{ !cancelled() && !matrix.packages }}
              uses: actions/upload-artifact@v7
              with:
                  name: js-coverage
                  path: assets/coverage/clover.xml
                  if-no-files-found: ignore
                  retention-days: 30

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: assets
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  package_json_file: 'assets/package.json'
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'
                  cache-dependency-path: 'assets/pnpm-lock.yaml'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build
              run: pnpm build

    docs-examples:
        name: Docs examples
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # ux_icon() normalizes attributes since symfony/ux-icons 3, which needs PHP 8.4+
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
            - name: Install dependencies
              run: composer update --no-interaction --no-progress
            # docs/src/data is committed: assets/test/parity.test.ts and the docs build compare it with renderIcon(), it must
            # match the PHP side
            - name: Render the examples
              run: php docs/scripts/render-examples.php
            - name: Check the committed renders are up to date
              run: |
                  git status --porcelain -- docs/src/data
                  test -z "$(git status --porcelain -- docs/src/data)" || { echo '::error::Run php docs/scripts/render-examples.php and commit docs/src/data'; exit 1; }

    coverage:
        name: Coverage
        needs: [qa, test]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: write
            pull-requests: write
        uses: silarhi/.github/.github/workflows/coverage-report.yml@main

    ci-passed:
        name: CI passed
        needs: [matrix, qa, lint, test, build, docs-examples]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check that all required jobs succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
